[plugin_settings."davinci13/containers"]
panel_layer = "overlay"
panel_placement = "floating"
panel_position = "center"
show_host_services = false
view_mode = "cards"

[plugin_settings."nilsonlinux/rss-notifier"]
Panel_layer = "overlay"
Panel_placement = "floating"
Panel_position = "center"

[plugin_settings."yuuto/calculator"]
panel_layer = "overlay"
panel_open_near_click = false
panel_placement = "floating"
panel_position = "center"

[plugins]
enabled = [
    "yuuto/calculator",
    "oldirtty/color_picker",
    "davinci13/containers",
    "noctalia/notes",
    "baizhu/paged-todo",
    "nilsonlinux/rss-notifier",
    "tmelik/system-monitor"
]

[shell]
font_family = "Noto Sans"

    [shell.screenshot]
    directory = "/home/blackscorp/Pictures/Screenshots"
    show_cursor = true

[theme]
builtin = "Ayu"
community_palette = "Breeze"
mode = "dark"
source = "community"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "mango", "qt", "umbriel" ]

[wallpaper]
directory = "/home/blackscorp/Wallpapers"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    recursive = true

    [wallpaper.default]
    path = "/home/blackscorp/Wallpapers/wallhaven-qr327r.png"

    [wallpaper.last]
    path = "/home/blackscorp/Wallpapers/wallhaven-qr327r.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/blackscorp/Wallpapers/wallhaven-qr327r.png"

[weather]
enabled = false

[widget.badge]
type = "nilsonlinux/rss-notifier:badge"

[widget.bar]
type = "yuuto/calculator:bar"

[widget.bar_2]
type = "davinci13/containers:bar"

[widget.control-center]
glyph = "person"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.notes]
type = "noctalia/notes:notes"

[widget.notifications]
hide_when_no_unread = true

[widget.taskbar]
group_by_workspace = true
hide_empty_workspaces = true
icon_scale = 1.5
show_workspace_label = false

[widget.widget]
type = "oldirtty/color_picker:widget"

[widget.workspaces]
hide_when_empty = true
scale = 1.1000000000000001