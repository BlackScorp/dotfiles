extensions:
  extensionmanager:
    enabled: true
    type: platform
    name: Extension Manager
    description: Enable extension management tools for discovering, enabling, and disabling extensions
    display_name: Extension Manager
    bundled: true
  apps:
    enabled: true
    type: platform
    name: apps
    description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
    display_name: Apps
    bundled: true
  tom:
    enabled: false
    type: platform
    name: tom
    description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
    display_name: Top Of Mind
    bundled: true
  analyze:
    enabled: true
    type: platform
    name: analyze
    description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
    display_name: Analyze
    bundled: true
  summon:
    enabled: true
    type: platform
    name: summon
    description: Load knowledge and delegate tasks to subagents
    display_name: Summon
    bundled: true
  summarize:
    enabled: true
    type: platform
    name: summarize
    description: Load files/directories and get an LLM summary in a single call
    display_name: Summarize
    bundled: true
  chatrecall:
    enabled: false
    type: platform
    name: chatrecall
    description: Search past conversations and load session summaries for contextual memory
    display_name: Chat Recall
    bundled: true
  code_execution:
    enabled: true
    type: platform
    name: code_execution
    description: Goose will make extension calls through code execution, saving tokens
    display_name: Code Mode
    bundled: true
  todo:
    enabled: true
    type: platform
    name: todo
    description: Enable a todo list for goose so it can keep track of what it is doing
    display_name: Todo
    bundled: true
  orchestrator:
    enabled: true
    type: platform
    name: orchestrator
    description: 'Manage agent sessions: list, view, start, send messages, interrupt, and stop agents'
    display_name: Orchestrator
    bundled: true
  developer:
    enabled: true
    type: platform
    name: developer
    description: Write and edit files, and execute shell commands
    display_name: Developer
    bundled: true
  skills:
    enabled: true
    type: platform
    name: skills
    description: Discover and provide skill instructions from filesystem and builtins
    display_name: Skills
    bundled: true
  rg:
    enabled: false
    type: stdio
    name: rg
    description: search for variables, class names and methods within the code using rg <searchpattern>
    cmd: rg
    args: []
    envs: {}
    env_keys: []
    timeout: 300
    cwd: null
    bundled: null
  memory:
    enabled: true
    type: builtin
    name: memory
    description: Tools to save and retrieve durable memories
    display_name: Memory
    timeout: 300
    bundled: true
  scheduler:
    enabled: true
    type: platform
    name: scheduler
    description: Create and manage scheduled recipe execution
    display_name: Scheduler
    bundled: true
GOOSE_TELEMETRY_ENABLED: false
OPENAI_HOST: http://vitalijs-pc:1234
OPENAI_BASE_PATH: v1/chat/completion
OPENAI_TIMEOUT: '600'
OLLAMA_HOST: http://localhost:11434
GOOSE_CLI_MIN_PRIORITY: 0.8
GOOSE_MAX_TURNS: 300
GOOSE_MODE: auto
providers:
  ollama:
    enabled: true
    model: lfm2.5-thinking:latest
    configured: true
  lmstudio:
    enabled: true
    model: ornith-1.0-9b
    configured: true
  custom_deepseek:
    enabled: true
    model: deepseek-flash
    configured: true
active_provider: custom_deepseek
LMSTUDIO_HOST: http://vitalijs-pc:1234
# GOOSE_THINKING_EFFORT: low  # wirkt nur bei Modellen, die reasoning_effort unterstützen (z. B. Meta Muse Spark); bei custom_deepseek ohne Wirkung
